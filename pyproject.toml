[project]
name = "py-obsidianmd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-frontmatter>=1.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.pytest.ini_options]
addopts = "--cov=pyomd --cov-report=term-missing --cov-report=html"

[dependency-groups]
dev = [
    "icecream>=2.2.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pyright]
exclude = [
    ".venv",
    "tests",
    "build"
]
